<aside class="sidebar" aria-label="Navegación principal">
  <a class="sidebar__logo" href="/" aria-label="Adaptivo Code Learn">
    <span class="sidebar__logo-hex" aria-hidden="true">AP</span>
    <span class="sidebar__logo-texto">ADAPTIVO<br>CODE LEARN</span>
  </a>
  <nav class="sidebar__nav">
    <a class="sidebar__enlace {{ 'activo' if request.url.path == '/' else '' }}" href="/">
      <span class="sidebar__icono sidebar__icono--inicio" aria-hidden="true"></span>
      <span class="sidebar__etiqueta">Inicio</span>
    </a>
    <a class="sidebar__enlace {{ 'activo' if request.url.path.startswith('/practica') else '' }}" href="/practica">
      <span class="sidebar__icono sidebar__icono--codigo" aria-hidden="true">&lt;/&gt;</span>
      <span class="sidebar__etiqueta">Practicar</span>
    </a>
    <a class="sidebar__enlace {{ 'activo' if request.url.path == '/progreso' else '' }}" href="/progreso">
      <span class="sidebar__icono sidebar__icono--progreso" aria-hidden="true"></span>
      <span class="sidebar__etiqueta">Progreso</span>
    </a>
    <a class="sidebar__enlace {{ 'activo' if request.url.path == '/entrenamiento' else '' }}" href="/entrenamiento">
      <span class="sidebar__icono sidebar__icono--entrenamiento" aria-hidden="true"></span>
      <span class="sidebar__etiqueta">Entrenar</span>
    </a>
  </nav>
  <div class="sidebar__pie">
    <button type="button" class="boton-sidebar" id="toggle-sidebar" aria-label="Ocultar barra lateral" aria-pressed="false">
      <span aria-hidden="true">☰</span>
    </button>
  </div>
</aside>
