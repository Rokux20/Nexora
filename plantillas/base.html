<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Nexora{% endblock %} · Nexora</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("adaptivo-tema") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/estatico/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/estatico/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/estatico/css/estilo.css?v=20261030-6">
</head>
<body>
  <button type="button" class="boton-sidebar-flotante" id="mostrar-sidebar" aria-label="Mostrar barra lateral">
    <span aria-hidden="true">☰</span>
  </button>
  <div class="app-shell">
    {% include "parciales/sidebar.html" %}
    <div class="app-main">
      <header class="header">
        <div class="header__estado"><span class="header__punto"></span>{% block contexto_header %}Plataforma de aprendizaje adaptativo{% endblock %}</div>
        <div class="header__contexto">
          <span class="header__marca-logo" aria-hidden="true">
            <img class="logo-tema logo-tema--claro" src="/estatico/img/marca-negra.png" alt="" width="26" height="26">
            <img class="logo-tema logo-tema--oscuro" src="/estatico/img/marca-blanca.png" alt="" width="26" height="26">
          </span>
          <span class="texto-tecnico">NEXORA</span>
          <button type="button" class="boton-tema" id="boton-tema" aria-pressed="false">
            <span class="boton-tema__icono" aria-hidden="true">○</span>
            <span class="boton-tema__texto">Tema</span>
          </button>
        </div>
      </header>
      <main class="principal">{% block contenido %}{% endblock %}</main>
      <footer class="pie">NEXORA · Prototipo académico de aprendizaje adaptativo</footer>
    </div>
  </div>
  <script src="/estatico/js/tema.js"></script>
  <script src="/estatico/js/sidebar.js"></script>
  <script src="/estatico/js/estado_vivo.js?v=20261030"></script>
  {% block js %}{% endblock %}
</body>
</html>
